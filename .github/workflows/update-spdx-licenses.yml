name: update spdx licenses

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew downloadLicensesJson
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update SPDX licenses"
          fi
      - name: Create Pull Request
        run: |
          gh pr create \
          --base trunk \
          --head auto-update-spdx-licenses \
          --title "Update SPDX licenses" \
          --body "_Auto-generated by `update spdx licenses` GitHub workflow._"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
